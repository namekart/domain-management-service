# =====================================================================
# DOMAIN MANAGEMENT SERVICE — Base Configuration
# Profile-specific overrides in application-dev.properties / application-prod.properties
# =====================================================================

spring.profiles.active=dev
spring.application.name=DomainManagementService

# Virtual threads (Java 21)
spring.threads.virtual.enabled=true

# ===== SERVER =====
server.port=91
spring.mvc.async.request-timeout=-1
spring.mvc.contentnegotiation.default-content-types=application/json

# ===== JACKSON =====
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=3000

# HikariCP connection pool
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.observation.enabled=true

# ===== OBSERVABILITY — TRACING =====
management.tracing.sampling.probability=0.0
management.tracing.propagation.type=w3c
management.tracing.annotations.enabled=true

observability.remote.enabled=false
observability.tempo.endpoint=http://107.174.54.244:4318/v1/traces
observability.loki.url=http://107.174.54.244:3100

# ===== OBSERVABILITY — ACTUATOR + PROMETHEUS =====
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=unrestricted
management.endpoint.loggers.access=unrestricted
management.prometheus.metrics.export.enabled=true

# ===== LOGGING =====
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.file.name=domain-management-service.log
logging.level.com.namekart.domainmanagement=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# ===== OPENAPI / SWAGGER =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ===== CORS =====
cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://localhost:5173,http://localhost:4200

# ===== FEIGN =====
spring.cloud.openfeign.okhttp.enabled=true
feign.client.config.RealtimeRegisterFeign.connect-timeout=30000
feign.client.config.RealtimeRegisterFeign.read-timeout=60000

# ===== REALTIME REGISTER API =====
realtimeregister.api.url=https://api.yoursrs.com
# REQUIRED — inject via env var RR_API_KEY in Coolify / local env
realtimeregister.api.key=${RR_API_KEY:}
